[project]
name = "wk-terminal"
version = "0.1.0"
description = "WaniKani in your terminal: reviews, lessons and kanji images via the kitty graphics protocol, plus a notification daemon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wanikani", "japanese", "kanji", "tui", "textual", "srs"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
authors = [
    { name = "ferjjp", email = "fer.jjp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jeepney>=0.9.0; sys_platform == 'linux'",
    "pillow>=12.3.0",
    "resvg-py>=0.5.0",
    "textual>=8.2.8",
    "textual-image>=0.13.2",
    "wanakana-python>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/ferjjp/wk-terminal"
Repository = "https://github.com/ferjjp/wk-terminal"
Issues = "https://github.com/ferjjp/wk-terminal/issues"

[project.scripts]
wk = "wanikani_tui.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "wanikani_tui"
